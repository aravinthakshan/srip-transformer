# Bidirectional LSTM Configuration
# =================================
# Single Bidirectional LSTM block with 3 independent prediction heads
# Sequential: OFF, Bidirectional: ON, Fitter: OFF

model:
  sequential: false
  bidirectional: true
  use_fitter: false
  use_hierarchical: false

lstm:
  hidden_dim: 64
  num_layers: 1
  dropout: 0.1

training:
  lookback: 7
  batch_size: 256
  learning_rate: 0.001
  epochs: 30
  random_seed: 74
