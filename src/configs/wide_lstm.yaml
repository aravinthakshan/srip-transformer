# Wide LSTM Configuration (Capacity-Matched Baseline)
# ====================================================
# Direct LSTM with increased hidden dimension to match
# the parameter count of the full SeqLSTM-MHA model.
# 
# This is the CRITICAL capacity-matched baseline for fair comparison.
# We increase hidden_dim so that:
#   params(wide_lstm) ≈ params(full_seqLSTM_MHA)
#
# Sequential: OFF, MHA: OFF, Hierarchical: OFF, Fitter: OFF
# Hidden dimension: 128 (approximately matches full model params)

model:
  sequential: false
  use_attention: false
  use_hierarchical: false
  use_fitter: false

lstm:
  # Increased hidden dimension for capacity matching
  # With hidden_dim=128, this gives approximately the same
  # number of parameters as the full model with hidden_dim=64 + attention
  hidden_dim: 128
  num_layers: 1
  bidirectional: false
  dropout: 0.1

training:
  lookback: 7
  batch_size: 256
  learning_rate: 0.001
  epochs: 30
  random_seed: 74

# NOTE: Run complexity.py to verify parameter count matches full model
# python complexity.py --config configs/full.yaml
# python complexity.py --config configs/wide_lstm.yaml
