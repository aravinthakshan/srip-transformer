# Full Configuration (Sequential + MHA + Fitter + Hierarchical)
# ==============================================================
# Complete model with ALL components enabled.
# Sequential: ON, Attention: ON, Fitter: ON, Hierarchical: ON

model:
  sequential: true
  bidirectional: false
  use_attention: true
  use_fitter: true
  use_hierarchical: true

lstm:
  hidden_dim: 64
  num_layers: 1
  dropout: 0.1

attention:
  num_heads: 8

training:
  lookback: 7
  batch_size: 256
  learning_rate: 0.001
  epochs: 30
  random_seed: 74
