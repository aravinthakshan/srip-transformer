# Sequential Configuration
# ========================
# Sequential LSTM prediction (T+1 feeds T+2, etc.)
# Sequential: ON, MHA: OFF, Hierarchical: OFF, Fitter: OFF

model:
  sequential: true
  use_attention: false
  use_hierarchical: false
  use_fitter: false

lstm:
  hidden_dim: 64
  num_layers: 1
  bidirectional: false
  dropout: 0.1

training:
  lookback: 7
  batch_size: 256
  learning_rate: 0.001
  epochs: 30
  random_seed: 74
