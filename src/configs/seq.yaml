# Sequential LSTM Configuration
# ==============================
# 3 separate LSTM blocks: Block k processes [t-7..t-1] + predictions 1..k-1
# Sequential: ON, Fitter: OFF

model:
  sequential: true
  bidirectional: false
  use_fitter: false
  use_hierarchical: false

lstm:
  hidden_dim: 64
  num_layers: 1
  dropout: 0.1

training:
  lookback: 7
  batch_size: 256
  learning_rate: 0.001
  epochs: 30
  random_seed: 74
