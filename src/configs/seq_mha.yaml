# Sequential LSTM + MHA Configuration
# =====================================
# 3 separate LSTM blocks with MHA attending over each block's hidden states.
# Sequential: ON, Attention: ON, Fitter: OFF

model:
  sequential: true
  bidirectional: false
  use_attention: true
  use_fitter: false
  use_hierarchical: false

lstm:
  hidden_dim: 64
  num_layers: 1
  dropout: 0.1

attention:
  num_heads: 8

training:
  lookback: 7
  batch_size: 256
  learning_rate: 0.001
  epochs: 30
  random_seed: 74
