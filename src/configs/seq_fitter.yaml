# Sequential LSTM + Hierarchical Features + Fitter Configuration
# ================================================================
# 3 separate LSTM blocks with pre-computed hierarchical quantile features
# AND an integrated rating curve fitter.
# For streamflow: predicts water level first, converts via fitter,
# then uses expected streamflow to improve the final prediction.
# Sequential: ON, Hierarchical: ON, Fitter: ON, Attention: OFF

model:
  sequential: true
  bidirectional: false
  use_attention: false
  use_fitter: true
  use_hierarchical: true

lstm:
  hidden_dim: 64
  num_layers: 1
  dropout: 0.1

training:
  lookback: 7
  batch_size: 256
  learning_rate: 0.001
  epochs: 30
  random_seed: 74
