# Sequential LSTM + Fitter Configuration
# ========================================
# 3 separate LSTM blocks with integrated rating curve fitter.
# For streamflow: predicts water level first, converts via fitter,
# then uses expected streamflow to improve the final prediction.
# Sequential: ON, Fitter: ON

model:
  sequential: true
  bidirectional: false
  use_fitter: true
  use_hierarchical: false

lstm:
  hidden_dim: 64
  num_layers: 1
  dropout: 0.1

training:
  lookback: 7
  batch_size: 256
  learning_rate: 0.001
  epochs: 30
  random_seed: 74
