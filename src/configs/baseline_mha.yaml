# Vanilla LSTM + MHA Configuration
# ==================================
# Single LSTM with Multi-Head Attention attending over hidden states.
# Sequential: OFF, Bidirectional: OFF, Attention: ON

model:
  sequential: false
  bidirectional: false
  use_attention: true
  use_fitter: false
  use_hierarchical: false

lstm:
  hidden_dim: 64
  num_layers: 1
  dropout: 0.1

attention:
  num_heads: 8

training:
  lookback: 7
  batch_size: 256
  learning_rate: 0.001
  epochs: 30
  random_seed: 74
